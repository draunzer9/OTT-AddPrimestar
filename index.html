<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFlow OTT - Share & Earn, Rental Upgrade Prompt & Bonus Pilot Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#e50914',
              gold: '#f59e0b',
              emerald: '#10b981',
              dark: '#07090e',
              surface: '#0d111a',
              card: '#121826'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen selection:bg-rose-600 selection:text-white">

  <!-- TOP SIMULATION & TESTING CONTROL BAR -->
  <header id="top-simulation-bar" class="w-full bg-[#0a0e17] border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-md">
    <!-- Populated by app.js:renderTopSimulationBar() -->
  </header>

  <!-- MAIN STREAMING NAVBAR -->
  <nav id="main-navbar" class="w-full bg-[#07090e]/80 backdrop-blur-xl border-b border-white/5 sticky top-[45px] z-30 transition-all">
    <!-- Populated by app.js:renderNavbar() -->
  </nav>

  <!-- MAIN APP CONTAINER -->
  <main class="min-h-screen pb-24">
    <!-- Hero Spotlight Section -->
    <section id="hero-section" class="px-4">
      <!-- Populated by app.js:renderHeroSection() -->
    </section>

    <!-- Content Catalog Rows -->
    <section id="content-catalog">
      <!-- Populated by app.js:renderContentRows() -->
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-900 bg-[#05070a] py-12 px-4 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="font-bold text-slate-400">StreamFlow Interactive Pilot Prototype</span>
        <span>• PRD Pilot Evaluation Build (IN Market)</span>
      </div>
      <div class="flex items-center space-x-4 text-slate-400">
        <span>Currencies: INR (₹)</span>
        <span>• 60-Day Pilot Window</span>
        <button onclick="openPilotDashboard()" class="text-rose-400 hover:underline">View PRD Unit Economics</button>
      </div>
    </div>
  </footer>

  <!-- MODAL CONTAINERS -->
  <div id="share-modal-container"></div>
  <div id="rental-prompt-container"></div>
  <div id="paywall-modal-container"></div>
  <div id="video-player-container"></div>
  <div id="pilot-dashboard-container"></div>
  
  <!-- SLIDE-OVER DRAWERS -->
  <div id="wallet-drawer-container"></div>
  <div id="telemetry-drawer-container"></div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- MAIN JAVASCRIPT APPLICATION -->
  <script src="app.js"></script>
</body>
</html>
